<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>대명여고 스마트 급식 알리미</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        
        /* 터치 스크롤 최적화 */
        html, body { 
            font-family: 'Pretendard', sans-serif;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: manipulation;
        }

        /* details 화살표 기본 스타일 제거 */
        details summary::-webkit-details-marker {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- 헤더 및 날짜 선택기 -->
        <header class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/60 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="text-xs font-bold text-rose-500 bg-rose-50 px-2.5 py-1 rounded-md">대명여고</span>
                <h1 class="text-xl md:text-2xl font-extrabold text-slate-900 mt-1">8월 스마트 급식 알리미 🍱</h1>
            </div>
            
            <!-- 날짜 컨트롤러 -->
            <div class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                <button onclick="changeDate(-1)" class="px-3 py-1.5 bg-white shadow-xs rounded-lg text-sm font-bold active:bg-slate-100">◀</button>
                <select id="date-select" onchange="onDateChange()" class="bg-transparent font-bold text-slate-700 text-sm md:text-base outline-none cursor-pointer py-1">
                    <!-- JS로 8월 날짜 자동 생성 -->
                </select>
                <button onclick="changeDate(1)" class="px-3 py-1.5 bg-white shadow-xs rounded-lg text-sm font-bold active:bg-slate-100">▶</button>
            </div>
        </header>

        <!-- 메인 급식 카드 (패드 가로모드 대응: md:grid-cols-2) -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 중식 카드 -->
            <details id="lunch-card" class="group bg-white rounded-3xl p-6 shadow-sm border border-slate-200/60 transition-all duration-200" open>
                <summary class="flex justify-between items-center cursor-pointer select-none list-none w-full">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">☀️</span>
                        <h2 class="text-lg font-bold text-slate-800">중식</h2>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="lunch-kcal" class="text-xs font-semibold px-2.5 py-1 bg-amber-50 text-amber-600 rounded-full">- kcal</span>
                        <span class="text-slate-400 font-bold transition-transform duration-200 group-open:rotate-180">▼</span>
                    </div>
                </summary>

                <div class="mt-4 pt-4 border-t border-slate-100 space-y-3">
                    <ul id="lunch-menu" class="space-y-2 text-slate-700 font-medium">
                        <!-- 중식 메뉴 삽입 -->
                    </ul>
                </div>
            </details>

            <!-- 석식 카드 -->
            <details id="dinner-card" class="group bg-white rounded-3xl p-6 shadow-sm border border-slate-200/60 transition-all duration-200" open>
                <summary class="flex justify-between items-center cursor-pointer select-none list-none w-full">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">🌙</span>
                        <h2 class="text-lg font-bold text-slate-800">석식</h2>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="dinner-kcal" class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-full">- kcal</span>
                        <span class="text-slate-400 font-bold transition-transform duration-200 group-open:rotate-180">▼</span>
                    </div>
                </summary>

                <div class="mt-4 pt-4 border-t border-slate-100 space-y-3">
                    <ul id="dinner-menu" class="space-y-2 text-slate-700 font-medium">
                        <!-- 석식 메뉴 삽입 -->
                    </ul>
                </div>
            </details>

        </main>
        
        <!-- 알레르기 안내 범례 -->
        <footer class="bg-white p-4 rounded-2xl border border-slate-200/60 text-xs text-slate-400 leading-relaxed">
            <p class="font-bold text-slate-500 mb-1">알레르기 유발식품 안내</p>
            <p>①난류 ②우유 ③메밀 ④땅콩 ⑤대두 ⑥밀 ⑦고등어 ⑧게 ⑨새우 ⑩돼지고기 ⑪복숭아 ⑫토마토 ⑬아황산염 ⑭호두 ⑮닭고기 ⑯소고기 ⑰오징어 ⑱조개류(굴,전복,홍합) ⑲잣</p>
        </footer>
    </div>

            const data = mealData[date];
            if (!data) return;

            document.getElementById('lunch-kcal').innerText = data.lunchKcal;
            document.getElementById('dinner-kcal').innerText = data.dinnerKcal;

            const lunchList = document.getElementById('lunch-menu');
            lunchList.innerHTML = data.lunch.map(item => `<li class="flex justify-between py-0.5 border-b border-slate-50"><span>${item}</span></li>`).join('');

            dinnerList.innerHTML = data.dinner.map(item => `<li class="flex justify-between py-0.5 border-b border-slate-50"><span>${item}</span></li>`).join('');
        }

        function onDateChange() {
            renderMeal(dateSelect.value);
        }

        function changeDate(offset) {
            const currentIndex = dates.indexOf(dateSelect.value);
            const newIndex = currentIndex + offset;
            if (newIndex >= 0 && newIndex < dates.length) {
                dateSelect.value = dates[newIndex];
                renderMeal(dates[newIndex]);
            }
        }

        // 초기화: 오늘 날짜(8월 중)이면 설정, 아니면 8월 첫 날로 세팅
